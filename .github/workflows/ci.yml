name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          PYTHONPATH=. pytest app/tests -q
      - name: Lint surveillance code
        working-directory: .
        run: ruff check backend/app/surveillance backend/app/api/surveillance.py backend/app/tests scripts/run_eval.py scripts/run_agent_eval.py
      - name: Eval smoke test on the tiny dataset (no network, stub model)
        working-directory: .
        run: |
          python scripts/simulate.py --preset tiny --out ci_data/tiny
          python scripts/run_eval.py --data ci_data/tiny --out ci_reports --smoke
          python scripts/run_agent_eval.py --data ci_data/tiny --out ci_reports --llm stub-mistakes --n 4
          test -s ci_reports/agent_eval.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build
        env:
          REACT_APP_API_URL: http://localhost:8000
        run: npm run build --no-audit --no-fund

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t complylite-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t complylite-frontend:ci ./frontend

